<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://docs.flutter.dev/ui/navigation/url-strategies
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Save the little things before time carries them away. The private place that catches a memory before it disappears.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Letters to Heaven">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Cache-busting meta so browsers prefer a fresh bootstrap after deploys. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta name="build-id" content="1.0.0+9" />

  <title>Letters to Heaven — Save the little things</title>
  <link rel="manifest" href="manifest.json">

  <!--
    PDF.js 5.x (used by package:printing on web) may call Map/WeakMap
    getOrInsertComputed. Chrome/Edge older than 145 throw NoSuchMethodError.
    Polyfill keeps Keepsake PdfPreview working on current browsers.
  -->
  <script>
    (function () {
      function installGetOrInsert(proto) {
        if (typeof proto.getOrInsert !== 'function') {
          proto.getOrInsert = function (key, defaultValue) {
            if (this.has(key)) {
              return this.get(key);
            }
            this.set(key, defaultValue);
            return defaultValue;
          };
        }
        if (typeof proto.getOrInsertComputed !== 'function') {
          proto.getOrInsertComputed = function (key, callback) {
            if (this.has(key)) {
              return this.get(key);
            }
            var value = callback(key);
            this.set(key, value);
            return value;
          };
        }
      }
      installGetOrInsert(Map.prototype);
      installGetOrInsert(WeakMap.prototype);
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
